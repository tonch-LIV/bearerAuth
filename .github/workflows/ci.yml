name: Tests

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      JWT_EXPIRATION_ENABLED: 'false'
      JWT_CONTEXT_ENABLED: 'false'

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '20.20.2'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests and collect coverage
        run: npm test -- --runInBand --coverage --collectCoverageFrom='src/**/*.js'